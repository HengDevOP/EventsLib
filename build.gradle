plugins {
    id 'java'
}

group = 'org.khmc.eventslib'
version = '1.0'

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
    compileOnly 'org.xerial:sqlite-jdbc:3.45.1.0'
    compileOnly files('../Shards/build/libs/Shards-1.0.jar')
}

jar {
    archiveFileName = "EventsLib-1.0.jar"
}

task copyToServer(type: Copy) {
    from jar
    into file('/Users/hochenheng/Desktop/khmc/plugins')
}

task copyToSurvivalSMP(type: Copy) {
    from jar
    into file('/Users/hochenheng/Desktop/SurvivalSMP/plugins')
}
build.finalizedBy(copyToServer, copyToSurvivalSMP)

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}
