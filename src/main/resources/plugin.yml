name: EventsLib
version: 1.0
main: org.khmc.eventslib.EventsLibPlugin
api-version: '1.21'
folia-supported: true
description: Powerful 54-slot events management library with SQLite persistence, Spin Wheel, and Shards economy integration.
softdepend: [Shards]
commands:
  el:
    description: EventsLib event management commands.
    aliases: [eventslib, eventlib]
permissions:
  eventslib.admin:
    description: Allows full access to EventsLib admin management and editor commands.
    default: op
  eventslib.use:
    description: Allows viewing public events.
    default: true
